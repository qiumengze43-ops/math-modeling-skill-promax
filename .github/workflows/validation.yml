name: validation

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python tests
        shell: pwsh
        run: python -m unittest discover -s scripts -p 'test_full_dry_run.py'

      - name: Compile Python scripts
        shell: pwsh
        run: python -m py_compile scripts/extract_cumcm2023c_sales.py scripts/full_dry_run.py scripts/smoke_test_milp.py scripts/test_full_dry_run.py

      - name: Run Bootstrap and routing tests
        shell: pwsh
        run: |
          ./scripts/test_global_router.ps1
          ./scripts/test_bundled_sources.ps1
          ./scripts/test_bootstrap_install_copy.ps1
          ./scripts/test_bootstrap_bundle.ps1
          ./scripts/test_bootstrap_install.ps1
          ./scripts/test_bootstrap.ps1
          ./scripts/test_bootstrap_default_root.ps1
          ./scripts/test_bundle_docs.ps1

      - name: Check diff formatting
        shell: pwsh
        run: git diff --check
